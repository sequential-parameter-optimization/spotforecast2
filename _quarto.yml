format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    toc-location: right
    code-copy: true
    code-fold: false
    highlight-style: github
    html-math-method: mathjax
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true

quartodoc:
  package: spotforecast2
  source_dir: src
  dir: docs/reference
  parser: google
  render_interlinks: true

  # Default options applied to every documented object.  include_inherited
  # surfaces methods a class inherits from its base classes so they are not
  # silently missing from the rendered API page.  The multitask task classes
  # inherit their pipeline steps (prepare_data, detect_outliers, impute,
  # build_exogenous_features, ...) cross-package from
  # spotforecast2_safe.multitask.base.BaseTask; griffe resolves these members
  # statically, so no `dynamic: true` is needed here (it remains only on the
  # agg_predictor re-export alias below).  Enforced by docs/check_api_coverage.py.
  options:
    include_inherited: true

  sections:
    - title: "Plots"
      desc: "Outlier, prediction, time-series, and operational diagnostic visualization tools."
      contents:
        - plots.diagnostics
        - plots.outlier_plots
        - plots.plotter
        - plots.time_series_visualization

    - title: "Model Selection"
      desc: "Search algorithms, cross-validation tools, and boundary management."
      contents:
        - model_selection.bayesian_search
        - model_selection.boundary
        - model_selection.grid_search
        - model_selection.random_search
        - model_selection.spotoptim_search
        - model_selection.utils_metrics

    - title: "Models"
      desc: "Full-featured forecaster classes with Bayesian tuning and SHAP."
      contents:
        # These full-models inherit fit / predict / backtest / ... cross-package
        # from spotforecast2_safe via the spotforecast2_safe.forecaster.wrappers
        # re-export alias, which griffe cannot resolve (statically or
        # dynamically) — so those inherited methods do not render here.  They are
        # documented on their canonical home, the spotforecast2-safe API site
        # (ForecasterRecursiveModel / ForecasterRecursiveLGBM), and are listed
        # under DOCUMENTED_ELSEWHERE in docs/check_api_coverage.py.
        - models.forecaster_recursive_model_full
        - models.forecaster_recursive_lgbm_full
        - models.forecaster_recursive_xgb_full

    - title: "Multitask"
      desc: "Multi-target forecasting pipeline tasks and dispatcher."
      contents:
        # agg_predictor is re-exported from spotforecast2_safe.multitask.base;
        # griffe cannot resolve the alias statically, so load it dynamically.
        - name: multitask.agg_predictor
          dynamic: true
        - multitask.BaseTask
        - multitask.LazyTask
        - multitask.OptunaTask
        - multitask.SpotOptimTask
        - multitask.PredictTask
        - multitask.CleanTask
        - multitask.MultiTask

    - title: "Stats"
      desc: "Statistical analysis tools."
      contents:
        - stats.autocorrelation

    - title: "ENTSO-E CLI"
      desc: "ENTSO-E download / train / predict command-line pipeline."
      contents:
        - entsoe_cli

    - title: "Warnings"
      desc: "Warning-style configuration for spotforecast2."
      contents:
        - warnings.exceptions

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    toc-location: right
    code-copy: true
    code-fold: false
    highlight-style: github
    html-math-method: mathjax
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true

quartodoc:
  package: spotforecast2
  source_dir: src
  dir: docs/reference
  parser: google
  render_interlinks: true

  sections:
    - title: "Plots"
      desc: "Outlier, prediction, and time-series visualization tools."
      contents:
        - plots.outlier_plots
        - plots.plotter
        - plots.time_series_visualization

    - title: "Model Selection"
      desc: "Search algorithms and cross-validation tools."
      contents:
        - model_selection.bayesian_search
        - model_selection.grid_search
        - model_selection.random_search
        - model_selection.spotoptim_search
        - model_selection.utils_metrics

    - title: "Models"
      desc: "Full-featured forecaster classes with Bayesian tuning and SHAP."
      contents:
        - models.forecaster_recursive_model_full
        - models.forecaster_recursive_lgbm_full
        - models.forecaster_recursive_xgb_full

    - title: "Multitask"
      desc: "Multi-target forecasting pipeline tasks and dispatcher."
      contents:
        # agg_predictor is re-exported from spotforecast2_safe.multitask.base;
        # griffe cannot resolve the alias statically, so load it dynamically.
        - name: multitask.agg_predictor
          dynamic: true
        - multitask.BaseTask
        - multitask.LazyTask
        - multitask.OptunaTask
        - multitask.SpotOptimTask
        - multitask.PredictTask
        - multitask.CleanTask
        - multitask.MultiTask

    - title: "Stats"
      desc: "Statistical analysis tools."
      contents:
        - stats.autocorrelation

    - title: "Tasks"
      desc: "Demonstration and predefined forecasting tasks."
      contents:
        - tasks.task_demo
        - tasks.task_entsoe
        - tasks.task_n_to_1
        - tasks.task_n_to_1_dataframe
        - tasks.task_n_to_1_with_covariates
        - tasks.task_n_to_1_with_covariates_and_dataframe

    - title: "Warnings"
      desc: "Warning-style configuration for spotforecast2."
      contents:
        - warnings.exceptions

name: Dependabot Auto-merge

# pull_request_target runs in the base-branch context and has access to
# repository secrets — required because Dependabot PRs cannot access org
# secrets under the pull_request event.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions: read-all

jobs:
  auto-merge:
    name: Approve and auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Approve using a PAT — GitHub Actions (GITHUB_TOKEN) cannot approve
      # PRs due to org-level policy; a PAT with 'repo' scope can.
      - name: Approve PR
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

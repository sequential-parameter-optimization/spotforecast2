name: Release

on:
  push:
    branches:
      - main
      - develop

# Principle of Least Privilege: Base permissions are read-only
permissions: read-all

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.13"
      
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5.2.2
      
      - name: Install dependencies
        run: |
          uv pip install --system build twine
          uv pip install --system -e ".[dev]"
      
      - name: Run tests
        run: |
          pytest tests/ -v
      
      - name: Verify package name in pyproject.toml
        run: |
          grep -q "name = \"spotforecast2\"" pyproject.toml || (echo "ERROR: Package name mismatch in pyproject.toml" && exit 1)
          echo "✓ Package name verified: spotforecast2"
      
      - name: Build distribution packages
        run: |
          python -m build
          echo "Build artifacts created:"
          ls -lah dist/
      
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 22
      
      - name: Install semantic-release
        run: |
          npm ci
      
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: npx semantic-release

      # ── Audit artifacts ────────────────────────────────────────────────────
      # The two steps below run only when semantic-release actually cut a
      # release: its version-bump prepareCmd writes `.released-tag` with the
      # git tag (see .releaserc.json), so `hashFiles('.released-tag')` is
      # non-empty exactly when a release happened. Mirrors the audit-artifact
      # convention in spotforecast2-safe's release workflow.
      - name: Generate CycloneDX SBOM from uv.lock
        if: success() && hashFiles('.released-tag') != ''
        # CycloneDX 1.5 SBOM of the resolved production dependency graph,
        # exported directly from uv.lock (no extra tool in the build env).
        # Written to the repo root, NOT dist/ — the PyPI publish step uploads
        # everything in dist/ and twine rejects non-distribution files.
        run: |
          uv export --preview-features sbom-export \
            --format cyclonedx1.5 --no-dev \
            -o sbom.cdx.json
          echo "CycloneDX 1.5 SBOM generated:"
          ls -lah sbom.cdx.json

      - name: Attach SBOM and lockfile to the GitHub Release
        if: success() && hashFiles('.released-tag') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # semantic-release already attached the wheel + sdist. Add the SBOM
        # (production closure) and uv.lock (exact full-closure resolution,
        # incl. dev tools, used by this release run) for the audit trail.
        # --clobber keeps re-runs idempotent.
        run: |
          gh release upload "$(cat .released-tag)" \
            sbom.cdx.json uv.lock --clobber

      - name: Publish to PyPI
        if: success()
        uses: pypa/gh-action-pypi-publish@f7600683efdcb7656dec5b29656edb7bc586e597  # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          # Note: No token needed with Trusted Publishers (OIDC)

      # Documentation is built and published by docs.yml — the single gh-pages
      # publisher. Building it here too caused a redundant second render and a
      # gh-pages push race between the two workflows, so it is intentionally
      # not done in this job.

      - name: Verify PyPI Release
        if: success()
        run: |
          echo "Release completed successfully!"
          echo "Verifying package on PyPI..."
          for i in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('https://pypi.org/project/spotforecast2/')" 2>/dev/null; then
              echo "✓ Package found on PyPI"
              break
            fi
            if [ $i -lt 30 ]; then
              echo "Waiting for PyPI to sync (attempt $i/30)..."
              sleep 10
            fi
          done

  # After a final release on main, merge main back into develop so that
  # CHANGELOG.md and pyproject.toml are in sync. Without this step,
  # both branches diverge on these files (main has "1.2.3", develop still
  # has "1.2.3-rc.N" from the last pre-release commit) and every subsequent
  # PR from develop -> main produces a conflict.
  back-merge:
    name: Sync main into develop
    runs-on: ubuntu-latest
    needs: release
    # Only run after a successful final release on main, not on develop rc releases.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          # Use the PAT so the push is authenticated.
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into develop
        run: |
          git fetch origin
          git checkout develop
          # -X theirs: when CHANGELOG.md / pyproject.toml conflict (both were
          # updated from the same rc base), keep main's final release version.
          git merge origin/main -X theirs --no-ff \
            -m "chore: sync main into develop [skip ci]"
          git push origin develop

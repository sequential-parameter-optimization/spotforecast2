[project]
name = "spotforecast2"
version = "10.0.0-rc.1"
description = "Forecasting with spot"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
authors = [
    { name = "bartzbeielstein", email = "32470350+bartzbeielstein@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astral>=3.2",
    "entsoe-py>=0.7.10",
    "feature-engine>=1.9.3",
    "holidays>=0.90",
    "ipykernel>=7.1.0",
    "jinja2>=3.1",
    "jupyter>=1.1.1",
    "kaleido>=1.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "numba>=0.63.1",
    "optuna>=4.7.0",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "pyarrow>=23.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
    "scikit-learn>=1.8.0",
    "shap>=0.49.1",
    # 22.0.0 made warm_start_lags the seed lag list itself (default
    # DEFAULT_WARM_START_LAGS, None disables) — consumed by SpotOptimStrategy.
    # 21.2.0 added max_time_spotoptim, forwarded as SpotOptim's max_time.
    "spotforecast2-safe>=22.3.0,<23",
    # spotoptim 1.0 is sequential-only and lean: torch/tensorboard moved to its
    # ``[torch]`` extra. sf2 forwards tensorboard_* kwargs into SpotOptim, so we
    # pin the extra to keep the TensorBoard tuning dashboards working (they were
    # always available via spotoptim's old hard torch dependency).
    "spotoptim[torch]>=1.0.0,<2",
    "tqdm>=4.67.2",
    # Directly imported by spotforecast2.entsoe_cli (and the xgb forecaster
    # model). Previously satisfied transitively; declared explicitly now that
    # spotoptim 1.0 no longer pulls it in.
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cloudpickle>=3.1.2",
    "quartodoc>=0.7.2",
    "pytest>=9.0.2",
    "pytest-anyio>=0.0.0",
    "ty>=0.0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "ruff>=0.3.0",
    "quartodoc>=0.7.2",
    "safety>=3.0.0",
    "bandit[sarif]>=1.8.0",
    "ty>=0.0.29",
]

[project.scripts]
spotforecast2-entsoe = "spotforecast2.entsoe_cli:main"

[tool.uv]
# Accept pre-releases ONLY for dependencies whose specifier carries an explicit
# pre-release marker. Re-add an rc marker to the spotforecast2-safe specifier
# (e.g. >=15.8.0rc1) to let sf2's CI integrate against an sf2-safe release
# candidate without waiting for the develop→main promotion; every other
# dependency stays on stable. The current floor tracks the breaking
# spotforecast2-safe 21.0.0 release, which dropped the now-dead
# n_jobs_spotoptim config field in lockstep with spotoptim 1.0
# (sequential-only); sf2 no longer reads or forwards it.
prerelease = "explicit"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.coverage.run]
branch = true
source = ["src/spotforecast2"]

[tool.coverage.report]
# Ratchet: lock in the current ~65% coverage (measured locally) so it cannot
# regress; 60 leaves margin for platform variance on CI. Raise deliberately as
# coverage improves. CI runs pytest with --cov, enforcing this.
fail_under = 60

# Astral `ty` type checker. Run non-blocking in CI (continue-on-error) so it
# surfaces type debt without failing the build; tighten to a gate later.
[tool.ty.environment]
python-version = "3.13"

# [tool.uv.sources]
# Local editable installs — use the sibling checkouts instead of PyPI:
# spotforecast2-safe = { path = "../spotforecast2-safe", editable = true }
# spotoptim = { path = "../spotoptim", editable = true }
